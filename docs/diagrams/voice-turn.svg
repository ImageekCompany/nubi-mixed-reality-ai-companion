<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 770" width="1200" height="770" role="img" aria-labelledby="t d">
<title id="t">Nubi architecture: one voice turn through the Meta models</title>
<desc id="d">Flow of one voice turn. The user pinches and speaks. Muse Voice Transcribe turns speech into text over a realtime WebSocket. On-device guards handle stop, crisis and short commands before any model call, and that path goes straight to the character. Everything else goes to Muse Spark 1.3 on the Responses API, which streams words and tool calls. Spark calls SAM 3.1 to outline the object, Spark vision to name and explain it, built-in web search for current facts, and body and memory tools. Spark's words go to Wit.ai speech, sentence by sentence. Speech and tools end at the character in the user's real room: it speaks, lip-syncs and walks the scanned floor, hidden by real furniture.</desc>
<style>
.kicker{font:600 15px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:2.5px;fill:#A9B4C6}
.head{font:700 34px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#F2F5FA}
.name{font:700 21px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#F2F5FA}
.sub{font:400 16px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#A9B4C6}
.note{font:italic 400 15px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#A9B4C6}
.tag{font:700 11px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:1.4px;fill:#5AA9FF}
.legend{font:500 14px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#A9B4C6}
.flow{fill:none;stroke:#50627C;stroke-width:2}
.dash{fill:none;stroke:#50627C;stroke-width:2;stroke-dasharray:6 6}
.metaflow{fill:none;stroke:#5AA9FF;stroke-width:2}
</style>
<rect width="1200" height="770" rx="22" fill="#0E1420"/>
<text class="kicker" x="44" y="62">ONE VOICE TURN</text>
<text class="head" x="44" y="104">Meta's models hear, think, see and speak.</text>
<rect x="844" y="52" width="14" height="14" rx="4" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/><text class="legend" x="866" y="64">Meta AI</text><rect x="938" y="52" width="14" height="14" rx="4" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/><text class="legend" x="960" y="64">On the headset</text><rect x="1076" y="52" width="14" height="14" rx="4" fill="#2B1D1C" stroke="#FF8A65" stroke-width="2"/><text class="legend" x="1098" y="64">Your room</text>
<path class="flow" d="M209 252 V286"/><path class="flow" d="M209 392 V426"/><path class="flow" d="M354 473 C 392 473, 392 340, 430 340"/><path class="metaflow" d="M710 300 C 748 300, 748 196, 784 196"/><path class="metaflow" d="M710 320 C 748 320, 748 298, 784 298"/><path class="metaflow" d="M710 345 C 748 345, 748 400, 784 400"/><path class="flow" d="M710 370 C 748 370, 748 502, 784 502"/><path class="metaflow" d="M570 450 V600"/><path class="metaflow" d="M710 646 H784"/><path class="flow" d="M960 548 V600"/><path class="dash" d="M209 520 V710 Q209 722 221 722 H948 Q960 722 960 712 V692"/><circle cx="209" cy="270" r="5" fill="#50627C"/><circle cx="209" cy="410" r="5" fill="#50627C"/><circle cx="392" cy="406" r="5" fill="#50627C"/><circle cx="748" cy="247" r="5" fill="#5AA9FF"/><circle cx="748" cy="308" r="5" fill="#5AA9FF"/><circle cx="748" cy="372" r="5" fill="#5AA9FF"/><circle cx="748" cy="436" r="5" fill="#50627C"/><circle cx="570" cy="525" r="5" fill="#5AA9FF"/><circle cx="747" cy="646" r="5" fill="#5AA9FF"/><circle cx="960" cy="574" r="5" fill="#50627C"/><text class="note" x="236" y="712">Instant path: no model round, a baked or local response</text><rect x="64" y="160" width="290" height="92" rx="14" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/><text class="name" x="84" y="190">You speak</text><text class="sub" x="84" y="215">Pinch and hold to talk</text><text class="sub" x="84" y="237">Mic stream, 24 kHz</text><rect x="64" y="286" width="290" height="106" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/><text class="tag" x="84" y="312">META MODEL · ASR</text><text class="name" x="84" y="335">Muse Voice Transcribe</text><text class="sub" x="84" y="360">Realtime WebSocket</text><text class="sub" x="84" y="382">Words appear as you talk</text><rect x="64" y="426" width="290" height="94" rx="14" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/><text class="name" x="84" y="456">On-device guards</text><text class="sub" x="84" y="481">Stop, crisis line, short</text><text class="sub" x="84" y="503">commands: before any model</text><rect x="430" y="210" width="280" height="240" rx="16" fill="#14263F" stroke="#5AA9FF" stroke-width="2.5"/><text class="tag" x="452" y="240">META MODEL · THE BRAIN</text><text class="name" style="font-size:25px" x="452" y="272">Muse Spark 1.3</text><text class="sub" x="452" y="304">Responses API, streamed</text><text class="sub" x="452" y="327">Tools run while it still talks</text><text class="sub" x="452" y="350">Speaks a preamble first</text><text class="sub" x="452" y="373">Encrypted reasoning replayed</text><text class="sub" x="452" y="396">Up to 4 rounds a turn</text><text class="sub" x="452" y="419">Persona, memory, room context</text><rect x="784" y="150" width="352" height="92" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/><text class="name" x="804" y="180">SAM 3.1</text><text class="sub" x="804" y="205">Outlines the object: hand-ray point,</text><text class="sub" x="804" y="227">hand joints as negatives, or text</text><rect x="784" y="252" width="352" height="92" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/><text class="name" x="804" y="282">Spark vision</text><text class="sub" x="804" y="307">Same frame, in parallel: names it,</text><text class="sub" x="804" y="329">answers, picks SAM's noun phrase</text><rect x="784" y="354" width="352" height="92" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/><text class="name" x="804" y="384">Web search (built in)</text><text class="sub" x="804" y="409">Weather, news, opening hours,</text><text class="sub" x="804" y="431">city-level location only</text><rect x="784" y="456" width="352" height="92" rx="14" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/><text class="name" x="804" y="486">Body and memory tools</text><text class="sub" x="804" y="511">Walk, follow, point, dance, look,</text><text class="sub" x="804" y="533">remember places and objects</text><rect x="430" y="600" width="280" height="92" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/><text class="name" x="450" y="630">Wit.ai speech</text><text class="sub" x="450" y="655">Sentence by sentence, raw PCM,</text><text class="sub" x="450" y="677">streamed as Spark writes</text><rect x="784" y="600" width="352" height="92" rx="14" fill="#2B1D1C" stroke="#FF8A65" stroke-width="2"/><text class="name" x="804" y="630">The character, in your room</text><text class="sub" x="804" y="655">Speaks and lip-syncs, walks the scanned</text><text class="sub" x="804" y="677">floor, hidden by your real furniture</text>
</svg>
