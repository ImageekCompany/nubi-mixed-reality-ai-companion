<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
<title id="t">Nubi hero turn: SAM segments, Spark explains</title>
<desc id="d">How a what-is-this question works. One passthrough camera frame and the user's pointing hand go to two Meta calls in parallel. SAM 3.1 receives a point from the hand ray and negative points from the hand joints, returns a one-bit mask decoded in C#, and the outline appears on the real object. Spark vision on the same frame streams a header with label, noun phrase and optional remembered place, then the spoken answer, which plays through Wit.ai speech with lip-sync. If the mask is empty, huge or on the hand, SAM is retried once with Spark's noun phrase. If Spark names a remembered place, the character walks there and points. Follow-up questions use SAM text prompts on the same frame: highlight_part outlines one part, find_object outlines every match.</desc>
<style>
.kicker{font:600 15px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:2.5px;fill:#A9B4C6}
.head{font:700 34px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#F2F5FA}
.name{font:700 21px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#F2F5FA}
.sub{font:400 16px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#A9B4C6}
.note{font:italic 400 15px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#A9B4C6}
.tag{font:700 11px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;letter-spacing:1.4px;fill:#5AA9FF}
.legend{font:500 14px 'Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif;fill:#A9B4C6}
.flow{fill:none;stroke:#50627C;stroke-width:2}
.dash{fill:none;stroke:#50627C;stroke-width:2;stroke-dasharray:6 6}
.metaflow{fill:none;stroke:#5AA9FF;stroke-width:2}
</style>
<rect width="1200" height="620" rx="22" fill="#0E1420"/>
<text class="kicker" x="44" y="62">THE HERO TURN: "WHAT IS THIS?"</text>
<text class="head" x="44" y="104">SAM segments. Spark explains.</text>
<rect x="844" y="52" width="14" height="14" rx="4" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/><text class="legend" x="866" y="64">Meta AI</text><rect x="938" y="52" width="14" height="14" rx="4" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/><text class="legend" x="960" y="64">On the headset</text><rect x="1076" y="52" width="14" height="14" rx="4" fill="#2B1D1C" stroke="#FF8A65" stroke-width="2"/><text class="legend" x="1098" y="64">Your room</text>
<path class="metaflow" d="M334 206 C 382 206, 382 206, 430 206"/><path class="metaflow" d="M334 206 C 382 206, 382 400, 430 400"/><path class="metaflow" d="M334 356 C 372 356, 372 240, 430 226"/><path class="flow" d="M730 206 H804"/><path class="metaflow" d="M730 400 H804"/><path class="dash" d="M580 352 V258"/><path class="flow" d="M1000 448 V498"/><circle cx="382" cy="206" r="5" fill="#5AA9FF"/><circle cx="767" cy="206" r="5" fill="#50627C"/><circle cx="767" cy="400" r="5" fill="#5AA9FF"/><text class="note" x="596" y="296">Mask empty, huge or on your hand?</text><text class="note" x="596" y="316">Retry once with Spark's noun phrase</text><rect x="64" y="150" width="270" height="112" rx="14" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/><text class="name" x="84" y="180">Camera frame</text><text class="sub" x="84" y="205">Passthrough, 640 px</text><text class="sub" x="84" y="227">Held in RAM, sent only when</text><text class="sub" x="84" y="249">a vision tool runs</text><rect x="64" y="300" width="270" height="112" rx="14" fill="#151D2C" stroke="#2A3648" stroke-width="1.5"/><text class="name" x="84" y="330">Your pointing hand</text><text class="sub" x="84" y="355">Hand ray projected into the</text><text class="sub" x="84" y="377">camera image; hand joints</text><text class="sub" x="84" y="399">become negative points</text><rect x="430" y="150" width="300" height="108" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/><text class="tag" x="450" y="176">META MODEL · SEGMENTS</text><text class="name" x="450" y="199">SAM 3.1</text><text class="sub" x="450" y="224">Point + negative prompts</text><text class="sub" x="450" y="246">one_bit mask, decoded in C#</text><rect x="430" y="352" width="300" height="108" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/><text class="tag" x="450" y="378">META MODEL · EXPLAINS</text><text class="name" x="450" y="401">Spark vision</text><text class="sub" x="450" y="426">Streams LABEL|PHRASE|PLACE,</text><text class="sub" x="450" y="448">then the spoken answer</text><rect x="804" y="150" width="332" height="108" rx="14" fill="#2B1D1C" stroke="#FF8A65" stroke-width="2"/><text class="name" x="824" y="180">Outline on the real object</text><text class="sub" x="824" y="205">Mask projected back into the room,</text><text class="sub" x="824" y="227">outline plus fill, in about 1 s</text><rect x="804" y="352" width="332" height="96" rx="14" fill="#2B1D1C" stroke="#FF8A65" stroke-width="2"/><text class="name" x="824" y="382">Spoken as it streams</text><text class="sub" x="824" y="407">Wit.ai speech with lip-sync; the</text><text class="sub" x="824" y="429">mask does not wait for the answer</text><rect x="804" y="498" width="332" height="86" rx="14" fill="#2B1D1C" stroke="#FF8A65" stroke-width="2"/><text class="name" x="824" y="528">Names a remembered place?</text><text class="sub" x="824" y="553">The character walks there, points</text><rect x="64" y="480" width="666" height="104" rx="14" fill="#14263F" stroke="#5AA9FF" stroke-width="2"/><text class="name" x="84" y="510">Follow-ups on the same frame: SAM text prompts</text><text class="sub" x="84" y="535">"Which button turns it on?"  highlight_part outlines just that part, no new photo.</text><text class="sub" x="84" y="557">"Where are my glasses?"  find_object outlines every match and looks at the nearest.</text>
</svg>
